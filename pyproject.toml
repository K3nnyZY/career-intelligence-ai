[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "career-intelligence-ai"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pypdf>=6,<7", "defusedxml>=0.7,<1"]
test = ["httpx>=0.28,<1"]
[project.scripts]
career-ai = "career_ai.cli:main"
career-ai-evaluate = "career_ai.evaluation:main"
[tool.setuptools.packages.find]
include = ["career_ai*"]
[tool.setuptools.package-data]
career_ai = ["static/index.html", "static/assets/*"]
